baseURL = 'https://hienbaole97.github.io/'
languageCode = 'en-us'
defaultContentLanguage = "en"

title = 'Hien Lê'

publishDir = "docs"

copyright = "© Hien Lê built with Hugo Theme Gallery"
disableKinds = ["taxonomy"]
enableRobotsTXT = true
timeZone = "Europe/Paris"
timeout = "120s"

# Theme used
theme = "gallery"

preserveTaxonomyNames = true
rssLimit = 10
paginate = 10

# Code highlighting
pygmentsCodefences = true

pygmentsStyle = "native"

# Taxonomies (only tags and categories are supported out of the box but you can
# add more)

# Configure permalinks style
[permalinks]
    post = "/:slug/"
    page = "/:slug/"

# Configure main navbar links. They can have a weight to select the order.
# This links to content within the content/post/ folder
[[menu.main]]
    name = "Gravures"
    url = "/gravures/"
    weight = -150

[[menu.main]]
    name = "Photos"
    url = "/photos/"
    weight = -150

# This links to the page about.md
[[menu.main]]
    name = "A propos"
    url = "/about/"
    weight = -110


# Site wide params and SEO
[params]
    # Site description. Individual pages can have descriptions too but if
    # missing it will fallback to that one.
    description = """Portfolio de Hien"""
    title = "Hien LÊ"
    # Author of the site
    authorName = "Hien LÊ"

    # Main image for the author. This will be the default image for SEO.
    [params.author]
        name = "Hien LÊ"

    [params.gallery]
        boxSpacing = 10
        previewType="blur"

    # Indicate if you host Katex yourself. Defaults to using the CDN KaTex.
    # hostedKaTex = false
    
    # Enable link to feed in footer
    blogrss = true

[services]
    [services.googleAnalytics]
        ID = 'G-X00LMH6JSP'

[outputs]
  home = ["HTML", "RSS"]
  page = ["HTML"]
  section = ["HTML"]
  
[imaging]
  quality = 75
  resampleFilter = "CatmullRom"
  [imaging.exif]
    disableDate = false
    disableLatLong = true
    includeFields = "ImageDescription|Orientation"

[build]
    publishResources = false

# Sitemap location (default is /sitemap.xml)
[sitemap]
  filename = "sitemap.xml"

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[markup.goldmark.renderHooks.image]
   enableDefault = true

[[module.mounts]]
   source = 'static'
   target = 'assets'

[[module.mounts]]
source = 'static/img'
target = 'assets/images'
